name: Validate skill mirror

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test copy-only synchronization
        run: python -m unittest discover -s tests -p 'test_*sync*.py' -v
      - name: Validate runtime trees and catalog
        shell: pwsh
        run: ./scripts/validate.ps1
